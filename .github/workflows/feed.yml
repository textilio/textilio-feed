name: Zmenšený Google feed

on:
  schedule:
    - cron: "17 21 * * *"   # každou noc ve 22:17 / 23:17 českého času
  workflow_dispatch:         # ruční spuštění tlačítkem

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout feed ze Shoptetu
        run: curl -fsSL --retry 3 -o feed.xml "${{ secrets.SHOPTET_FEED_URL }}"
      - name: Zmenšit feed
        run: |
          mkdir -p public
          python3 filter_feed.py feed.xml public/google.xml.gz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
